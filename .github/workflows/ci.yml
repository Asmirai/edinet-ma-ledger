# テスト・型・書式を、push と PR のたびに確かめる。EDINET の書類（data/）は使わない
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ブラウザのシミュレーターが、Python と同じ確率を出すかを確かめる
      - run: node --test site/
