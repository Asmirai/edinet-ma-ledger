[project]
name = "edinet-ma-ledger"
version = "0.1.0"
description = "有価証券報告書から上場企業の M&A 台帳を作り、買収の失敗（のれんの減損）を予測する"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
figures = [
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
# テストは対象と同じディレクトリの *.test.py に置き、関数名は日本語にする（AGENTS.md）。集め方は conftest.py
testpaths = ["."]
python_files = ["*.test.py"]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["."]
# ノートブックは説明のための実行例なので、strict の型チェックから外す（ruff の検査は続ける）。
# exclude を書くと既定の除外が消えるので、隠しフォルダと __pycache__ も並べる
exclude = ["notebooks", "**/.*", "**/__pycache__"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
# 行幅は表示幅で数えるため、日本語の文字列で頻発する。整形は formatter に任せる
ignore = ["E501"]

[tool.coverage.run]
source = ["ledger"]
# テストそのものと、macOS のフォントで図を描くだけの figures は数えない
omit = ["ledger/*.test.py", "ledger/figures.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# いまの値（2026-10 時点で 80%）を下回ったら CI を落とす
fail_under = 80
